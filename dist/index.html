<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KandyKaneKraft - The Ultimate Voxel Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background: #000;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    #ui h1 {
      font-size: 28px;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    #ui p {
      font-size: 14px;
      opacity: 0.9;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    .crosshair-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #hotbar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
    }

    .hotbar-slot {
      width: 50px;
      height: 50px;
      background: rgba(100, 100, 100, 0.8);
      border: 2px solid #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 24px;
    }

    .hotbar-slot:hover {
      background: rgba(150, 150, 150, 0.8);
      transform: scale(1.1);
    }

    .hotbar-slot.active {
      border-color: #ffff00;
      background: rgba(255, 215, 0, 0.3);
    }

    #stats {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 14px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      z-index: 10;
      font-family: 'Courier New', monospace;
    }

    #instructions {
      position: absolute;
      bottom: 100px;
      right: 20px;
      color: white;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #ff69b4;
      z-index: 10;
      max-width: 250px;
    }

    .instruction-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #ff69b4;
    }

    .instruction-item {
      margin: 4px 0;
      font-size: 12px;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      text-align: center;
      z-index: 100;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="loading">🍭 Loading KandyKaneKraft... 🍬</div>
    <div id="ui">
      <h1>🍭 KandyKaneKraft 🍬</h1>
      <p>Welcome to the Sweet Adventure!</p>
    </div>
    <div id="crosshair">
      <div class="crosshair-dot"></div>
    </div>
    <div id="hotbar">
      <div class="hotbar-slot active">🍬</div>
      <div class="hotbar-slot">🍫</div>
      <div class="hotbar-slot">🍮</div>
      <div class="hotbar-slot">🍭</div>
      <div class="hotbar-slot">🧁</div>
      <div class="hotbar-slot">🌪️</div>
      <div class="hotbar-slot">🏔️</div>
      <div class="hotbar-slot">💧</div>
    </div>
    <div id="stats">
      <div>FPS: <span id="fps">60</span></div>
      <div>Blocks: <span id="blocks">0</span></div>
    </div>
    <div id="instructions">
      <div class="instruction-title">🎮 CONTROLS</div>
      <div class="instruction-item">W/A/S/D - Move</div>
      <div class="instruction-item">SPACE - Jump</div>
      <div class="instruction-item">Mouse - Look Around</div>
      <div class="instruction-item">Left Click - Destroy</div>
      <div class="instruction-item">Right Click - Place</div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js",
        "cannon": "https://cdn.jsdelivr.net/npm/cannon@0.20.0/build/cannon.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { World, Body, Box, Sphere } from 'cannon';

    // Game Class
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x87ceeb);
        this.scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

        this.camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        this.camera.position.set(0, 50, 0);

        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        this.renderer.outputEncoding = THREE.sRGBEncoding;

        this.setupLighting();

        this.physics = new World();
        this.physics.gravity.set(0, -20, 0);
        this.physics.defaultContactMaterial.friction = 0.3;

        window.addEventListener('resize', () => this.onWindowResize());
      }

      setupLighting() {
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        this.scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -200;
        sunLight.shadow.camera.right = 200;
        sunLight.shadow.camera.top = 200;
        sunLight.shadow.camera.bottom = -200;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        this.scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x654321, 0.4);
        this.scene.add(hemiLight);
      }

      onWindowResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        this.camera.aspect = width / height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(width, height);
      }

      render() {
        this.renderer.render(this.scene, this.camera);
      }
    }

    // Player Class
    class Player {
      constructor(camera, physicsWorld) {
        this.camera = camera;
        this.physicsWorld = physicsWorld;
        this.position = new THREE.Vector3(0, 50, 0);
        this.direction = new THREE.Vector3(0, 0, -1);
        this.euler = new THREE.Euler(0, 0, 0, 'YXZ');
        this.PI_2 = Math.PI / 2;

        const playerShape = new Sphere(0.5);
        this.body = new Body({ mass: 1, shape: playerShape });
        this.body.linearDamping = 0.3;
        this.body.position.set(this.position.x, this.position.y, this.position.z);
        physicsWorld.addBody(this.body);

        this.cameraOffset = new THREE.Vector3(0, 0.6, 0);
        this.speed = 20;
        this.jumpForce = 15;
        this.canJump = true;
        this.raycaster = new THREE.Raycaster();
        this.blockReach = 5;
      }

      update(keys) {
        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();
        const moveDirection = new THREE.Vector3();

        this.camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        if (keys['w']) moveDirection.add(forward);
        if (keys['s']) moveDirection.sub(forward);
        if (keys['a']) moveDirection.sub(right);
        if (keys['d']) moveDirection.add(right);

        if (moveDirection.length() > 0) {
          moveDirection.normalize();
          this.body.velocity.x = moveDirection.x * this.speed;
          this.body.velocity.z = moveDirection.z * this.speed;
        } else {
          this.body.velocity.x *= 0.8;
          this.body.velocity.z *= 0.8;
        }

        if (keys[' '] && this.canJump) {
          this.body.velocity.y = this.jumpForce;
          this.canJump = false;
        }

        this.body.velocity.y -= 9.8 * 0.016;
        this.position.copy(this.body.position);
        this.camera.position.copy(this.position).add(this.cameraOffset);
      }

      rotateCamera(deltaX, deltaY) {
        const sensitivity = 0.003;
        this.euler.setFromQuaternion(this.camera.quaternion);
        this.euler.rotateY(-deltaX * sensitivity);
        this.euler.rotateX(-deltaY * sensitivity);
        this.euler.x = Math.max(-this.PI_2, Math.min(this.PI_2, this.euler.x));
        this.camera.quaternion.setFromEuler(this.euler);
      }

      placeBlock(scene, blockManager) {
        this.raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        const intersects = this.raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
          const hit = intersects[0];
          const pos = hit.point.clone();
          const normal = hit.face.normal.clone();
          normal.transformDirection(hit.object.matrixWorld);
          const newPos = pos.clone().add(normal);
          blockManager.createBlock('candy', Math.round(newPos.x), Math.round(newPos.y), Math.round(newPos.z));
        }
      }
    }

    // BlockManager Class
    const BLOCK_TYPES = {
      grass: { color: 0x7cb342 },
      dirt: { color: 0x8d6e63 },
      stone: { color: 0x9e9e9e },
      candy: { color: 0xff69b4 },
      chocolate: { color: 0x8b4513 },
      caramel: { color: 0xd4a574 },
      sugar: { color: 0xffffff },
      lollipop: { color: 0xff1493 },
      sand: { color: 0xf4a460 },
      water: { color: 0x1e90ff },
      ice: { color: 0xb0e0e6 }
    };

    class BlockManager {
      constructor(scene) {
        this.scene = scene;
        this.blocks = new Map();
        this.blockSize = 1;
      }

      createBlock(type, x, y, z) {
        const key = `${x},${y},${z}`;
        if (this.blocks.has(key)) return null;
        const blockData = BLOCK_TYPES[type] || BLOCK_TYPES.stone;
        const geometry = new THREE.BoxGeometry(this.blockSize, this.blockSize, this.blockSize);
        const material = new THREE.MeshStandardMaterial({
          color: blockData.color,
          roughness: 0.7,
          metalness: 0.1
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData.type = type;
        this.scene.add(mesh);
        this.blocks.set(key, mesh);
        return mesh;
      }
    }

    // WorldGenerator Class
    class WorldGenerator {
      constructor() {
        this.seed = Math.random() * 10000;
        this.scale = 50;
      }

      noise(x, y) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      perlinNoise(x, y) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const xf = x - xi;
        const yf = y - yi;
        const u = xf * xf * (3 - 2 * xf);
        const v = yf * yf * (3 - 2 * yf);
        const n00 = this.noise(xi, yi);
        const n10 = this.noise(xi + 1, yi);
        const n01 = this.noise(xi, yi + 1);
        const n11 = this.noise(xi + 1, yi + 1);
        const nx0 = n00 * (1 - u) + n10 * u;
        const nx1 = n01 * (1 - u) + n11 * u;
        return nx0 * (1 - v) + nx1 * v;
      }

      generateTerrain(offsetX, offsetZ, chunkSize) {
        const voxels = [];
        const chunkWidth = 16;
        const maxHeight = 40;
        const waterLevel = 20;

        for (let x = 0; x < chunkWidth * chunkSize; x++) {
          for (let z = 0; z < chunkWidth * chunkSize; z++) {
            const noiseX = (offsetX + x) / this.scale;
            const noiseZ = (offsetZ + z) / this.scale;
            let height = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxAmplitude = 0;
            for (let i = 0; i < 4; i++) {
              height += this.perlinNoise(noiseX * frequency, noiseZ * frequency) * amplitude;
              maxAmplitude += amplitude;
              amplitude *= 0.5;
              frequency *= 2;
            }
            height = (height / maxAmplitude) * maxHeight + 15;
            height = Math.floor(height);
            for (let y = 0; y < height; y++) {
              let blockType = 'stone';
              if (y < 5) blockType = 'stone';
              else if (y < height - 3) blockType = Math.random() > 0.7 ? 'chocolate' : 'dirt';
              else if (y < height - 1) blockType = 'dirt';
              else if (y === height - 1) blockType = y > waterLevel ? 'grass' : 'sand';
              if (Math.random() < 0.05 && y > 5 && y < height - 5) {
                blockType = ['candy', 'caramel', 'lollipop'][Math.floor(Math.random() * 3)];
              }
              voxels.push({ type: blockType, x: offsetX + x, y: y, z: offsetZ + z });
            }
            if (height < waterLevel) {
              for (let y = height; y < waterLevel; y++) {
                voxels.push({ type: 'water', x: offsetX + x, y: y, z: offsetZ + z });
              }
            }
          }
        }
        return voxels;
      }
    }

    // Initialize game
    const canvas = document.getElementById('gameCanvas');
    const game = new Game(canvas);
    const worldGenerator = new WorldGenerator();
    const blockManager = new BlockManager(game.scene);
    const player = new Player(game.camera, game.physics);

    const terrain = worldGenerator.generateTerrain(0, 0, 8);
    terrain.forEach(voxel => {
      blockManager.createBlock(voxel.type, voxel.x, voxel.y, voxel.z);
    });

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    let mouseDown = false;
    document.addEventListener('mousedown', (e) => {
      if (e.button === 0) mouseDown = true;
      if (e.button === 2) player.placeBlock(game.scene, blockManager);
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) mouseDown = false;
    });
    document.addEventListener('mousemove', (e) => {
      if (mouseDown) player.rotateCamera(e.movementX, e.movementY);
    });

    canvas.addEventListener('click', () => {
      canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
      canvas.requestPointerLock();
    });

    document.getElementById('loading').style.display = 'none';

    let lastTime = Date.now();
    let frameCount = 0;
    function gameLoop() {
      requestAnimationFrame(gameLoop);
      player.update(keys);
      game.physics.step(1 / 60);
      game.camera.position.copy(player.position);
      game.render();

      frameCount++;
      const now = Date.now();
      if (now - lastTime >= 1000) {
        document.getElementById('fps').textContent = frameCount;
        document.getElementById('blocks').textContent = blockManager.blocks.size;
        frameCount = 0;
        lastTime = now;
      }
    }
    gameLoop();
  </script>
</body>
</html>
